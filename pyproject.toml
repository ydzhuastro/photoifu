[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoifu"
version = "0.1.0"
description = "Public PhotoIFU workflow tools for pixel photometry, lightweight SED fitting, and resolved SED-map analysis."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Yongda Zhu" }
]
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "scikit-learn",
  "PyYAML",
]

[project.optional-dependencies]
stats = ["scipy"]
sed = ["fsps"]

[tool.setuptools.packages.find]
where = ["src"]
